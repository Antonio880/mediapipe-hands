<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instrumento Gestual</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <!-- Cabeçalho -->
    <header class="topbar">
      <div class="brand">
      </div>

      <div class="topbar__right">
        <div class="mode" role="group" aria-label="Modo de som">
          <button class="mode__btn is-active" data-mode="chords" type="button">Acordes</button>
          <button class="mode__btn" data-mode="notes" type="button">Notas</button>
          <button class="mode__btn" data-mode="melody" type="button">Melodia</button>
        </div>

        <button class="gear" id="gear-btn" type="button" aria-expanded="false" aria-controls="control-panel" title="Ajustes do synth">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 1 1-2.92 2.92l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V19.6a2.06 2.06 0 1 1-4.12 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.92-2.92l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H4.4a2.06 2.06 0 1 1 0-4.12h.09A1.7 1.7 0 0 0 6.05 7.2a1.7 1.7 0 0 0-.34-1.87l-.06-.06A2.06 2.06 0 1 1 8.57 2.35l.06.06a1.7 1.7 0 0 0 1.87.34H10.6A1.7 1.7 0 0 0 11.63 1.19V1.1a2.06 2.06 0 1 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 1 1 2.92 2.92l-.06.06a1.7 1.7 0 0 0-.34 1.87v.1a1.7 1.7 0 0 0 1.56 1.03h.09a2.06 2.06 0 1 1 0 4.12h-.09a1.7 1.7 0 0 0-1.56 1.03Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Painel de controles do synth -->
    <div class="control-panel" id="control-panel" aria-hidden="true">
      <div class="control-panel__row">
        <label class="control" for="waveform">
          <span class="control__label">Forma de onda</span>
          <select id="waveform" class="control__select">
            <option value="triangle">Triângulo</option>
            <option value="sine">Senoide</option>
            <option value="sawtooth">Dente de serra</option>
            <option value="square">Quadrada</option>
          </select>
        </label>

        <div class="control">
          <span class="control__label">Modo de disparo</span>
          <div class="segmented" role="group" aria-label="Modo de disparo">
            <button class="segmented__btn is-active" data-play-mode="trigger" type="button">Trigger</button>
            <button class="segmented__btn" data-play-mode="pad" type="button">Pad (sustain)</button>
          </div>
        </div>
      </div>

      <div class="control-panel__row">
        <label class="control" for="volume">
          <span class="control__label">Volume <span id="volume-val">70</span>%</span>
          <input type="range" id="volume" class="control__slider" min="0" max="100" value="70" />
        </label>

        <label class="control" for="reverb">
          <span class="control__label">Reverb <span id="reverb-val">28</span>%</span>
          <input type="range" id="reverb" class="control__slider" min="0" max="100" value="28" />
        </label>

        <label class="control" for="release">
          <span class="control__label">Release <span id="release-val">0.9</span>s</span>
          <input type="range" id="release" class="control__slider" min="10" max="250" value="90" />
        </label>

        <label class="control" for="transpose">
          <span class="control__label">Transpor <span id="transpose-val">+0 · Dó</span></span>
          <input type="range" id="transpose" class="control__slider" min="-12" max="12" value="0" step="1" />
        </label>
      </div>
    </div>

    <!-- Palco: câmera + HUD -->
    <main class="viewport">
      <!-- Vídeo cru (oculto): usado apenas como fonte para o MediaPipe -->
      <video id="input-video" playsinline></video>

      <!-- Canvas de saída: imagem espelhada + landmarks -->
      <canvas id="output-canvas"></canvas>

      <!-- Tela inicial sobre a câmera -->
      <div class="cover" id="cover">
        <div class="cover__inner">
          <button id="start-btn" class="start" type="button">Iniciar câmera e áudio</button>
          <p class="cover__status" id="status">Aguardando início</p>
        </div>
      </div>

      <!-- HUD sobreposto -->
      <div class="hud" id="hud" aria-live="polite">
        <div class="hud__degree">
          <span class="hud__numeral" id="numeral">–</span>
          <span class="hud__label" id="chord-name">Silêncio</span>
          <span class="hud__notes" id="chord-notes">mostre as mãos</span>
        </div>

        <div class="hud__hands">
          <div class="hand-chip">
            <span class="hand-chip__key">Esq.</span>
            <span class="hand-chip__val" id="left-count">0</span>
          </div>
          <div class="hand-chip hand-chip--total">
            <span class="hand-chip__key">Total</span>
            <span class="hand-chip__val" id="total-count">0</span>
          </div>
          <div class="hand-chip">
            <span class="hand-chip__key">Dir.</span>
            <span class="hand-chip__val" id="right-count">0</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Legenda dos graus -->
    <footer class="legend" id="legend"></footer>
  </div>

  <!-- Bibliotecas via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <script src="script.js"></script>
</body>
</html>
